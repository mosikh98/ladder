[package]
name = "ladder"
version = "0.1.0"
edition = "2021"
description = "Psiphon method ladder and Windscribe-over-Cloudflare relay, with per-method second budgets"
license = "MIT"
publish = false

[[bin]]
name = "ladder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "time", "sync", "fs", "signal"] }
toml = "0.8"
tokio-rustls = "0.26"
x509-parser = "0.16"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[profile.release]
strip = true
