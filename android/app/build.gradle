plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mosikh98.ladder'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mosikh98.ladder'
        minSdk 26
        // 28 on purpose: apps targeting 29+ may not exec binaries from their
        // own data dir, and this app runs an imported psiphon-tunnel-core.
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile file('../ladder.keystore')
            storePassword 'ladder123'
            keyAlias 'ladder'
            keyPassword 'ladder123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // Needed so libladder.so / libpsiphon.so are extracted to nativeLibraryDir and can be exec'd.
    packagingOptions { jniLibs { useLegacyPackaging = true } }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// config.example.toml and the servers example live in the Rust crate; copy them into assets.
tasks.register('copyLadderAssets', Copy) {
    from(file('../../config.example.toml'))
    from(file('../../examples/servers.example.json'))
    into file('src/main/assets')
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'copyLadderAssets' }
